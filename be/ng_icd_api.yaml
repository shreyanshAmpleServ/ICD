  parameters:
    SiteId:
      name: X-Site-Id
      in: header
      required: true
      description: Site the call acts on. Must be one of the user's sites from /me.
      schema:
        type: integer
        format: int32
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID. A retry with the same key returns the first result (kept 24 h).
      schema:
        type: string
        format: uuid
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Required: this command may be retried from the offline queue or a flaky network.'
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current logInst of the record (optimistic concurrency).
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 50
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: Field name, prefix with - for descending, e.g. -createdAt.
  responses:
    BadRequest:
      description: Malformed request or invalid parameter.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or expired token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: No permission for this action at this site (code FORBIDDEN or APPROVAL_REQUIRED).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, or not visible to this user.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: State conflict, e.g. the unit already left or the period is closed. code tells which rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: logInst in If-Match is stale; reload and retry.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unprocessable:
      description: Validation failed; errors lists each field.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: If-Match is required for this update.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token from the NG identity server (OIDC, PKCE). Audience: ng-icd-api.'
    deviceToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Client-credentials token of a registered gate agent; scope device:ingest.
    partnerToken:
      type: apiKey
      in: header
      name: X-Partner-Key
      description: Per-partner key for inbound EDI, rotated by the admin; IP allow-list applies.
