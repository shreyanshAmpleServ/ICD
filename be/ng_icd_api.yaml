# DCC NG ICD - CONFIDENTIAL internal design document. Generated by gen.py; do not edit by hand.
openapi: 3.1.0
info:
  title: DCC NG ICD API
  version: 1.0.0-design
  license:
    name: Proprietary - Double Click
    identifier: LicenseRef-Proprietary
  description: "The REST API of DCC NG ICD (ICD, ICDV, CFS, empty depot and warehouse), both phases (M0-M6).\n\n\
    ## Conventions\n- **Base path** `/api/v1`, one deployment per region; the tenant comes from the token (`tenant`\
    \ claim), never from the URL.\n- **Site scope**: operational calls carry `X-Site-Id`. The server checks the\
    \ user holds the permission at that site.\n- **Permissions** use the codes in `m_permission`. Each operation\
    \ shows its code in `x-permission`.\n  An action above the user's limit returns `403` with code `APPROVAL_REQUIRED`\
    \ and the approval request id,\n  unless the endpoint itself creates the approval request (exception-based approvals).\n\
    - **Commands** are `POST /resource/{id}:verb`. Plain CRUD uses `GET/POST/PATCH`; masters are deactivated, never\
    \ deleted.\n- **Concurrency**: updates send the record's `logInst` in `If-Match`; a stale value gives `412`.\n\
    - **Idempotency**: commands send `Idempotency-Key` (UUID). It is required on gate, yard, payment, device\n \
    \ and other edge commands that the offline queue may replay.\n- **Offline**: queued gate and yard events carry\
    \ `occurredAt` and `isOffline=true`; the server orders them by\n  `occurredAt`, and anything that conflicts\
    \ opens an exception case instead of failing silently.\n- **Lists** use cursor paging: `?cursor=&limit=` returning\
    \ `{items, nextCursor}`; `sort=-field`.\n- **Money and decimals** are strings (`\"1250.00\"`) with a currency\
    \ code; never floats. Dates are ISO 8601; times\n  in UTC with the site time zone in `/me`.\n- **Errors** are\
    \ `application/problem+json` (RFC 9457) with a stable `code` and `correlationId`.\n- **Real time**: Socket.IO\
    \ namespace `/rt`, rooms `site:{siteId}:{channel}` (gate-queue, yard, control-tower,\n  approvals, notifications).\
    \ Payloads are the same `EventEnvelope` as the webhooks below.\n- **Events** to NG and subscribers are listed\
    \ under `webhooks` (delivered from the outbox, at least once;\n  dedupe on `eventId`).\n"
  x-confidential: Internal design document of Double Click. Do not distribute.
