# DCC NG ICD - CONFIDENTIAL internal design document. Generated by gen.py; do not edit by hand.
openapi: 3.1.0
info:
  title: NG endpoints used by NG ICD
  version: 1.0.0-design
  license:
    name: Proprietary - Double Click
    identifier: LicenseRef-Proprietary
  description: 'What the NG team implements so NG ICD can sync masters, send events and post journals.


    Authentication: client-credentials token from the NG identity server for client `ng-icd-service`, one per tenant
    database; scopes `icd.sync.read`, `icd.events.write`, `icd.journals.write`.


    Users and roles are not synced: users sign in through NG identity and ICD keeps its own role grants.'
  x-confidential: Internal design document of Double Click. Do not distribute.
servers:
- url: https://{ngHost}/api
  variables:
    ngHost:
      default: ng.example.com
security:
- ngClient: []
tags:
- name: Master sync
  description: Incremental pull of parties, trucks and drivers.
- name: Events
  description: ICD domain events pushed to NG.
- name: Billing
  description: Journals from ICD invoices, payments and notes into the NG ledger.
paths:
  /icd-sync/parties:
    get:
      tags:
      - Master sync
      operationId: syncParties
      summary: Parties changed since a point
      description: Ordered by (updatedAt, ngRefId). ICD stores the last pair and asks again with it. Deleted or
        merged records come back as tombstones.
      parameters:
      - name: updatedSince
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: afterRefId
        in: query
        required: false
        schema:
          type: string
        description: Tie-breaker for rows with the same updatedAt.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          maximum: 2000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgPartyPage'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /icd-sync/trucks:
    get:
      tags:
      - Master sync
      operationId: syncTrucks
      summary: Trucks changed since a point
      description: Ordered by (updatedAt, ngRefId). ICD stores the last pair and asks again with it. Deleted or
        merged records come back as tombstones.
      parameters:
      - name: updatedSince
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: afterRefId
        in: query
        required: false
        schema:
          type: string
        description: Tie-breaker for rows with the same updatedAt.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          maximum: 2000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgTruckPage'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /icd-sync/drivers:
    get:
      tags:
      - Master sync
      operationId: syncDrivers
      summary: Drivers changed since a point
      description: Ordered by (updatedAt, ngRefId). ICD stores the last pair and asks again with it. Deleted or
        merged records come back as tombstones.
      parameters:
      - name: updatedSince
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: afterRefId
        in: query
        required: false
        schema:
          type: string
        description: Tie-breaker for rows with the same updatedAt.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 500
          maximum: 2000
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NgDriverPage'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /icd-events:
    post:
      tags:
      - Events
      operationId: receiveIcdEvent
      summary: Receive an ICD domain event
      description: At-least-once delivery from the ICD outbox. NG must dedupe on eventId and return 202 fast; processing
        is asynchronous. Retries back off up to 24 h, then the event is parked for an admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
      responses:
        '202':
          description: Accepted (also for a duplicate)
        '400':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /billing/icd-journals:
    post:
      tags:
      - Billing
      operationId: postIcdJournal
      summary: Post an ICD journal to the NG ledger
      description: 'Idempotent on sourceRef: a repeat returns the first result. Reject (422) if unbalanced, the
        account is unknown or the NG period is closed; ICD marks the posting FAILED and an admin retries.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Journal'
      responses:
        '200':
          description: Posted or already posted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResult'
        '202':
          description: Queued in NG
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResult'
        '401':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /billing/icd-journals/{sourceRef}:
    get:
      tags:
      - Billing
      operationId: getIcdJournal
      summary: Status of a posted journal
      parameters:
      - name: sourceRef
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalResult'
        '404':
          description: Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
      required:
      - type
      - title
      - status
      - code
    FieldError:
      type: object
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
      required:
      - field
      - code
      - message
    EventEnvelope:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
          - UnitExpected
          - TruckArrived
          - UnitGatedIn
          - UnitInspected
          - UnitMoved
          - UnitWeighed
          - HoldPlaced
          - HoldLifted
          - CustomsStatusChanged
          - ReleaseRequested
          - ReleaseApproved
          - ReleaseExpired
          - GateOutBlocked
          - UnitGatedOut
          - InvoicePosted
          - CreditNoteIssued
          - PaymentReceived
          - FreeTimeExpiring
          - ExceptionOpened
          - ExceptionEscalated
        eventVersion:
          type: integer
          format: int32
        tenantCode:
          type: string
        siteId:
          type:
          - integer
          - 'null'
          format: int64
        occurredAt:
          type: string
          format: date-time
        aggregateType:
          type: string
        aggregateId:
          type: integer
          format: int64
        correlationId:
          type:
          - string
          - 'null'
          format: uuid
        payload:
          type: object
          additionalProperties: true
      required:
      - eventId
      - eventType
      - eventVersion
      - tenantCode
      - occurredAt
      - aggregateType
      - aggregateId
      - payload
    NgParty:
      type: object
      required:
      - ngRefId
      - updatedAt
      - partyCode
      - partyName
      properties:
        ngRefId:
          type: string
          description: Stable NG primary key.
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          description: 'Tombstone: ICD deactivates its copy.'
        partyCode:
          type: string
        partyName:
          type: string
        roles:
          type: array
          items:
            type: string
        taxId:
          type:
          - string
          - 'null'
        vatNo:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        addressLine1:
          type:
          - string
          - 'null'
        city:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        defaultCurrency:
          type:
          - string
          - 'null'
        creditStatus:
          type: string
          enum:
          - CASH
          - CREDIT
          - BLOCKED
        creditLimit:
          type:
          - string
          - 'null'
          format: decimal
        contacts:
          type: array
          items:
            type: object
            additionalProperties: true
    NgPartyPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NgParty'
        hasMore:
          type: boolean
    NgTruck:
      type: object
      required:
      - ngRefId
      - updatedAt
      - plateNo
      properties:
        ngRefId:
          type: string
          description: Stable NG primary key.
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          description: 'Tombstone: ICD deactivates its copy.'
        plateNo:
          type: string
        transporterNgRefId:
          type:
          - string
          - 'null'
        countryCode:
          type:
          - string
          - 'null'
        makeModel:
          type:
          - string
          - 'null'
        tareKg:
          type:
          - integer
          - 'null'
    NgTruckPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NgTruck'
        hasMore:
          type: boolean
    NgDriver:
      type: object
      required:
      - ngRefId
      - updatedAt
      - driverName
      - licenceNo
      properties:
        ngRefId:
          type: string
          description: Stable NG primary key.
        updatedAt:
          type: string
          format: date-time
        isActive:
          type: boolean
        isDeleted:
          type: boolean
          description: 'Tombstone: ICD deactivates its copy.'
        driverName:
          type: string
        licenceNo:
          type: string
        licenceExpiry:
          type:
          - string
          - 'null'
          format: date
        licenceCountry:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        transporterNgRefId:
          type:
          - string
          - 'null'
    NgDriverPage:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NgDriver'
        hasMore:
          type: boolean
    JournalLine:
      type: object
      required:
      - lineNo
      - glAccount
      - debit
      - credit
      properties:
        lineNo:
          type: integer
        glAccount:
          type: string
        costCentre:
          type:
          - string
          - 'null'
        partyNgRefId:
          type:
          - string
          - 'null'
        debit:
          type: string
          format: decimal
        credit:
          type: string
          format: decimal
        narration:
          type:
          - string
          - 'null'
        taxCode:
          type:
          - string
          - 'null'
    Journal:
      type: object
      required:
      - sourceRef
      - sourceKind
      - companyCode
      - documentDate
      - currency
      - lines
      properties:
        sourceRef:
          type: string
          description: Unique ICD reference, e.g. INV-DAR-2026-000123. Idempotency key.
        sourceKind:
          type: string
          enum:
          - INVOICE
          - CREDIT_NOTE
          - DEBIT_NOTE
          - PAYMENT
          - REFUND
          - DISBURSEMENT
          - WRITE_OFF
          - SHIFT_VARIANCE
        companyCode:
          type: string
        siteCode:
          type: string
        documentDate:
          type: string
          format: date
        currency:
          type: string
        exchangeRate:
          type: string
          format: decimal
          description: To base currency, as frozen on the ICD document.
        baseCurrency:
          type: string
        narration:
          type:
          - string
          - 'null'
        lines:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/JournalLine'
      description: 'Balanced journal: sum(debit) = sum(credit) in document currency.'
    JournalResult:
      type: object
      required:
      - sourceRef
      - status
      properties:
        sourceRef:
          type: string
        status:
          type: string
          enum:
          - POSTED
          - PENDING
          - REJECTED
        ngDocumentNo:
          type:
          - string
          - 'null'
        postedAt:
          type:
          - string
          - 'null'
          format: date-time
        message:
          type:
          - string
          - 'null'
  securitySchemes:
    ngClient:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://ng.example.com/connect/token
          scopes:
            icd.sync.read: Read changed masters
            icd.events.write: Send ICD events
            icd.journals.write: Post journals
